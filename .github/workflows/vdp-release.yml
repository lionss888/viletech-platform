name: VDP Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "vdp-v*"

concurrency:
  group: vdp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vdp
          POSTGRES_PASSWORD: vdp
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            vdp/core/go.sum
            vdp/hub/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vdp/fe/package-lock.json
      - name: Bootstrap postgres for integration tests
        run: |
          chmod +x vdp/scripts/ci-bootstrap-postgres.sh
          PGHOST=localhost POSTGRES_USER=vdp POSTGRES_PASSWORD=vdp ./vdp/scripts/ci-bootstrap-postgres.sh
      - name: Release gate
        working-directory: vdp
        env:
          DATABASE_URL_CORE: postgres://vdp_core:vdp_core@localhost:5432/vdp_core?sslmode=disable
          DATABASE_URL_HUB: postgres://vdp_hub:vdp_hub@localhost:5432/vdp_hub?sslmode=disable
        run: |
          make db-migrate
          make release-gate
      - name: Compose down
        if: always()
        working-directory: vdp
        run: make compose-down

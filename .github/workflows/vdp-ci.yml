name: VDP CI

on:
  push:
    branches: [main, master]
    paths:
      - "vdp/**"
      - ".github/workflows/vdp-*.yml"
      - ".gitlab-ci.yml"
  pull_request:
    paths:
      - "vdp/**"
      - ".github/workflows/vdp-*.yml"
      - ".gitlab-ci.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: vdp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-parity:
    name: environment parity check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify .nvmrc exists
        run: |
          if [ ! -f vdp/fe/.nvmrc ]; then
            echo "❌ vdp/fe/.nvmrc missing. Create it to pin Node.js version."
            exit 1
          fi
          echo "✅ .nvmrc found: $(cat vdp/fe/.nvmrc)"
      - name: Verify CI uses node-version-file
        run: |
          if ! grep -q "node-version-file.*\.nvmrc" .github/workflows/vdp-ci.yml; then
            echo "❌ CI workflow must use 'node-version-file: vdp/fe/.nvmrc', not hardcoded version"
            exit 1
          fi
          echo "✅ CI workflow uses .nvmrc"
      - name: Verify package-lock.json exists
        run: |
          if [ ! -f vdp/fe/package-lock.json ]; then
            echo "❌ vdp/fe/package-lock.json missing. Run 'npm install' in vdp/fe."
            exit 1
          fi
          echo "✅ package-lock.json found"
      - name: Verify .go-version exists
        run: |
          if [ ! -f vdp/.go-version ]; then
            echo "❌ vdp/.go-version missing. Create it to pin Go major.minor for CI."
            exit 1
          fi
          echo "✅ .go-version found: $(tr -d '[:space:]' < vdp/.go-version)"
      - name: Verify CI uses go-version-file
        run: |
          if ! grep -q 'tr -d.*vdp/\.go-version\|cat vdp/\.go-version' .github/workflows/vdp-ci.yml; then
            echo "❌ CI workflow must read Go version from vdp/.go-version"
            exit 1
          fi
          if grep -E 'go-version:[[:space:]]*"1\.[0-9]+"' .github/workflows/vdp-ci.yml; then
            echo "❌ CI workflow must not hardcode go-version; use vdp/.go-version"
            exit 1
          fi
          echo "✅ CI workflow reads vdp/.go-version"

  fast:
    name: fast (unit)
    if: >-
      github.actor != 'vdp-mirror-bot' &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip mirror-loop]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [env-parity]
    steps:
      - uses: actions/checkout@v4
      - name: Read Go version pin
        id: go-version
        run: echo "version=$(tr -d '[:space:]' < vdp/.go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: |
            vdp/core/go.sum
            vdp/hub/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: vdp/fe/.nvmrc
          cache: npm
          cache-dependency-path: vdp/fe/package-lock.json
      - name: FE unit tests
        working-directory: vdp/fe
        run: npm ci && npm test
      - name: Go unit tests
        working-directory: vdp
        run: make test
      - name: Hub adapter tests
        working-directory: vdp
        run: make test-adapters

  docs:
    name: docs format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Docs format check
        working-directory: vdp
        run: make docs-format-check
      - name: CD scripts smoke
        working-directory: vdp
        run: make test-cd-scripts

  integration:
    name: integration (postgres + compose-e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [env-parity, fast]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vdp
          POSTGRES_PASSWORD: vdp
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Read Go version pin
        id: go-version
        run: echo "version=$(tr -d '[:space:]' < vdp/.go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache-dependency-path: |
            vdp/core/go.sum
            vdp/hub/go.sum
      - name: Bootstrap postgres roles and databases
        env:
          PGPASSWORD: vdp
        run: |
          chmod +x vdp/scripts/ci-bootstrap-postgres.sh
          PGHOST=localhost POSTGRES_USER=vdp POSTGRES_PASSWORD=vdp ./vdp/scripts/ci-bootstrap-postgres.sh
      - name: Migrate postgres (CI service)
        working-directory: vdp
        env:
          DATABASE_URL_CORE: postgres://vdp_core:vdp_core@localhost:5432/vdp_core?sslmode=disable
          DATABASE_URL_HUB: postgres://vdp_hub:vdp_hub@localhost:5432/vdp_hub?sslmode=disable
        run: make db-migrate
      - name: Go postgres integration tests
        working-directory: vdp
        env:
          DATABASE_URL_CORE: postgres://vdp_core:vdp_core@localhost:5432/vdp_core?sslmode=disable
          DATABASE_URL_HUB: postgres://vdp_hub:vdp_hub@localhost:5432/vdp_hub?sslmode=disable
        run: make test-integration
      - name: Compose stack + API E2E
        working-directory: vdp
        env:
          # Long suite must not trip gateway 429 (compose defaults 2000; pin explicitly for CI).
          GATEWAY_RATE_LIMIT: "2000"
        run: |
          make compose-up
          ./scripts/compose-e2e.sh
      - name: Compose down
        if: always()
        working-directory: vdp
        run: make compose-down

  playwright:
    name: playwright (browser E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [env-parity, fast]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up + Playwright journeys
        working-directory: vdp
        env:
          CI: "true"
          GATEWAY_RATE_LIMIT: "2000"
          # PR: narrow required journeys. Otherwise (main push, schedule, dispatch): full suite.
          PLAYWRIGHT_ARGS: ${{ github.event_name == 'pull_request' && 'e2e/login-form.spec.ts e2e/user-submit.spec.ts e2e/provider-acl.spec.ts e2e/reject-path.spec.ts' || '' }}
        run: |
          make compose-up
          make playwright-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            vdp/fe/test-results
            vdp/fe/playwright-report
          if-no-files-found: ignore
      - name: Compose down
        if: always()
        working-directory: vdp
        run: make compose-down

  # PR-only: catch full-ladder / status-branch regressions that narrow Playwright misses.
  detect-pilot-matrix:
    name: detect pilot-matrix paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter relevant paths
        id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base"..."$head" || true)"
          echo "Changed files (sample):"
          printf '%s\n' "$changed" | head -40
          chmod +x vdp/scripts/pilot-matrix-paths-match.sh
          if printf '%s\n' "$changed" | vdp/scripts/pilot-matrix-paths-match.sh; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "pilot-matrix required for this PR"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "pilot-matrix skipped (paths outside ladder risk surface)"
          fi


  playwright-pilot-matrix:
    name: playwright (pilot-matrix)
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-pilot-matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [env-parity, fast, detect-pilot-matrix]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up + pilot-matrix journeys
        working-directory: vdp
        env:
          CI: "true"
          GATEWAY_RATE_LIMIT: "2000"
          PLAYWRIGHT_ARGS: "--grep @pilot-matrix"
        run: |
          make compose-up
          make playwright-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-pilot-matrix-traces
          path: |
            vdp/fe/test-results
            vdp/fe/playwright-report
          if-no-files-found: ignore
      - name: Compose down
        if: always()
        working-directory: vdp
        run: make compose-down

  mgmt-notify:
    name: management notify
    if: >-
      always() &&
      github.actor != 'vdp-mirror-bot' &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip mirror-loop]'))
    needs: [env-parity, fast, docs, integration, playwright, detect-pilot-matrix, playwright-pilot-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Notify management channel
        env:
          MGMT_NOTIFY_TOKEN: ${{ secrets.MGMT_NOTIFY_TOKEN || secrets.TELEGRAM_INTAKE_TOKEN }}
          MGMT_NOTIFY_CHAT_ID: ${{ secrets.MGMT_NOTIFY_CHAT_ID || secrets.MGMT_NOTIFY_CHAT_IDS || secrets.TELEGRAM_INTAKE_CHAT_IDS }}
          NEED_fast_RESULT: ${{ needs.fast.result }}
          NEED_docs_RESULT: ${{ needs.docs.result }}
          NEED_integration_RESULT: ${{ needs.integration.result }}
          NEED_playwright_RESULT: ${{ needs.playwright.result }}
          NEED_pilot_matrix_RESULT: ${{ needs.playwright-pilot-matrix.result }}
        run: |
          chmod +x vdp/scripts/ci-mgmt-notify.sh vdp/scripts/notify-mgmt.sh
          ./vdp/scripts/ci-mgmt-notify.sh auto

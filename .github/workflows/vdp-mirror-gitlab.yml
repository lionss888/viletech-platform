name: VDP Mirror to GitLab

# One-way sync: GitHub monorepo (canonical) → GitLab vdp888/viletech-platform.
# Do NOT set GITLAB_MIRROR_URL to vdp888/vdp (that project is Lovable UI only).
# Requires repo secrets GITLAB_MIRROR_URL + GITLAB_MIRROR_TOKEN.
# Optional: GITLAB_REGISTRY_PROJECT (for vdp-images crane copy; same namespace).

on:
  push:
    branches: [main, master]
    tags: ["vdp-v*"]
    paths-ignore:
      - "**.md"
      - "заметки/**"
      - "вводные/**"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to mirror (default main)
        required: false
        default: main
      allow_skip:
        description: If true, missing secrets exit 0 (default fail)
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: vdp-mirror-gitlab
  cancel-in-progress: false

jobs:
  # Early infra signal: missing/invalid secrets are NOT a product regression.
  preflight:
    name: preflight (mirror config)
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'vdp-mirror-bot' &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip mirror-loop]'))
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      mirror_host: ${{ steps.meta.outputs.mirror_host }}
      mirror_path: ${{ steps.meta.outputs.mirror_path }}
      reason: ${{ steps.meta.outputs.reason }}
    steps:
      - name: Require and normalize GitLab mirror secrets
        id: meta
        env:
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          ALLOW_SKIP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_skip || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_MIRROR_URL:-}" ] || [ -z "${GITLAB_MIRROR_TOKEN:-}" ]; then
            echo "reason=missing_secrets" >> "$GITHUB_OUTPUT"
            echo "::error title=mirror-preflight::reason=missing_secrets GITLAB_MIRROR_URL and GITLAB_MIRROR_TOKEN must be set (GitHub → Settings → Secrets)."
            echo "Expected URL: https://gitlab.com/vdp888/viletech-platform (not vdp888/vdp)"
            if [ "${ALLOW_SKIP}" = "true" ]; then
              echo "allow_skip=true — exiting without push"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          raw="$GITLAB_MIRROR_URL"
          raw="${raw%/}"
          raw="${raw%.git}"
          host=$(printf '%s' "$raw" | sed -E 's#https?://##; s#/.*##')
          path=$(printf '%s' "$raw" | sed -E 's#https?://[^/]+/##')
          if [ -z "$host" ] || [ -z "$path" ] || [[ "$path" == *" "* ]]; then
            echo "reason=invalid_url" >> "$GITHUB_OUTPUT"
            echo "::error title=mirror-preflight::reason=invalid_url Invalid GITLAB_MIRROR_URL (redacted)."
            exit 1
          fi
          if [[ "$path" == "vdp888/vdp" ]]; then
            echo "reason=wrong_target" >> "$GITHUB_OUTPUT"
            echo "::error title=mirror-preflight::reason=wrong_target GITLAB_MIRROR_URL points at Lovable repo vdp888/vdp. Use vdp888/viletech-platform for monorepo mirror."
            exit 1
          fi
          echo "reason=ok" >> "$GITHUB_OUTPUT"
          echo "mirror_host=$host" >> "$GITHUB_OUTPUT"
          echo "mirror_path=$path" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Mirror target: https://${host}/${path}"

  mirror:
    name: push to GitLab (vdp888)
    needs: [preflight]
    runs-on: ubuntu-latest
    if: >-
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.skip != 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Configure GitLab remote
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          MIRROR_HOST: ${{ needs.preflight.outputs.mirror_host }}
          MIRROR_PATH: ${{ needs.preflight.outputs.mirror_path }}
        run: |
          set -euo pipefail
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://oauth2:${GITLAB_MIRROR_TOKEN}@${MIRROR_HOST}/${MIRROR_PATH}.git"
          # Never print remote URL (contains token).
          git remote get-url gitlab >/dev/null

      - name: Push branches and tags to GitLab
        run: |
          set -euo pipefail
          git config user.name "vdp-mirror-bot"
          git config user.email "vdp-mirror-bot@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BR="${{ inputs.branch }}"
            echo "Pushing HEAD → refs/heads/${BR} (force-with-lease)"
            git push gitlab "HEAD:refs/heads/${BR}" --force-with-lease
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Pushing tag ${{ github.ref }} and updating main"
            git push gitlab "${{ github.ref }}:${{ github.ref }}" --force
            git push gitlab "HEAD:refs/heads/main" --force-with-lease
          else
            echo "Pushing HEAD → refs/heads/${{ github.ref_name }} (force-with-lease)"
            git push gitlab "HEAD:refs/heads/${{ github.ref_name }}" --force-with-lease
          fi
          echo "Mirror push completed."

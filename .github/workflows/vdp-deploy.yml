name: VDP Deploy

on:
  workflow_run:
    workflows: [VDP Images]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      images_run_id:
        description: Images workflow run id (leave empty = triggering run or latest on main)
        required: false
        default: ""

concurrency:
  group: vdp-deploy-${{ github.event.inputs.environment || 'staging' }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  resolve-pin:
    name: resolve image pin
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.meta.outputs.target_env }}
    steps:
      - name: Resolve target environment
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve images workflow run id
        id: runid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.images_run_id }}" ]; then
            echo "id=${{ github.event.inputs.images_run_id }}" >> "$GITHUB_OUTPUT"
          else
            rid=$(gh run list --workflow=vdp-images.yml --branch=main --limit=1 --json databaseId --jq '.[0].databaseId')
            echo "id=${rid}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release-images-pin artifact
        uses: actions/download-artifact@v4
        with:
          name: release-images-pin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runid.outputs.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-pin
          path: release-images.env
          retention-days: 7

  deploy-staging:
    name: deploy staging
    needs: [resolve-pin]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.resolve-pin.outputs.target_env == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-pin
          path: pin
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy staging (compose pull, no build)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY_PATH: ~/.ssh/deploy_key
          PIN_FILE: pin/release-images.env
          ENVIRONMENT: staging
        run: |
          chmod +x vdp/scripts/deploy-compose-release.sh
          ./vdp/scripts/deploy-compose-release.sh

  deploy-production:
    name: deploy production
    needs: [resolve-pin]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-pin
          path: pin
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Promote same digest to production (no rebuild)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY_PATH: ~/.ssh/deploy_key
          PIN_FILE: pin/release-images.env
          ENVIRONMENT: production
        run: |
          chmod +x vdp/scripts/deploy-compose-release.sh
          ./vdp/scripts/deploy-compose-release.sh

  deploy-staging-manual:
    name: deploy staging (manual)
    needs: [resolve-pin]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-pin
          path: pin
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy staging (manual dispatch)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY_PATH: ~/.ssh/deploy_key
          PIN_FILE: pin/release-images.env
          ENVIRONMENT: staging
        run: |
          chmod +x vdp/scripts/deploy-compose-release.sh
          ./vdp/scripts/deploy-compose-release.sh

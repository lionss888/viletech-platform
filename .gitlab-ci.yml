# VDP CI on GitLab (secondary forge). Canonical merge: GitHub main only.
# Promote jobs reuse the same digests copied into GitLab Container Registry (no rebuild).

workflow:
  rules:
    # Skip pipeline when GitHub mirror bot pushed to default branch (avoid loop).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[skip mirror-loop\]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_AUTHOR =~ /vdp-mirror-bot/'
      when: never
    - when: always

default:
  interruptible: true

variables:
  FF_NETWORK_PER_BUILD: "true"
  DOCKER_TLS_CERTDIR: "/certs"
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  POSTGRES_USER: vdp
  POSTGRES_PASSWORD: vdp
  POSTGRES_DB: postgres
  DATABASE_URL_CORE: postgres://vdp_core:vdp_core@postgres:5432/vdp_core?sslmode=disable
  DATABASE_URL_HUB: postgres://vdp_hub:vdp_hub@postgres:5432/vdp_hub?sslmode=disable

stages:
  - fast
  - docs
  - integration
  - playwright
  - promote
  - notify

.vdp_changes: &vdp_changes
  changes:
    - vdp/**/*
    - .gitlab-ci.yml

.go_cache: &go_cache
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - vdp/core/.cache
      - vdp/hub/.cache

.node_cache: &node_cache
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - vdp/fe/node_modules/

.promote_rules_manual: &promote_rules_manual
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

.promote_script: &promote_script
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash openssh-client rsync curl docker-cli python3
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - |
      if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
        echo "GitLab Environment secrets not configured — skip promote"
        exit 0
      fi
    - |
      if [ -n "${CI_REGISTRY_IMAGE:-}" ] && [ -f vdp/.release-images.env ]; then
        set -a && . vdp/.release-images.env && set +a
      fi
    - chmod +x vdp/scripts/gitlab-promote.sh
    - PIN_FILE=vdp/.release-images.env ./vdp/scripts/gitlab-promote.sh
  after_script:
    - rm -f ~/.ssh/deploy_key || true
    - |
      # Management TG notify (optional CI vars: MGMT_NOTIFY_TOKEN + MGMT_NOTIFY_CHAT_ID)
      if [ -z "${MGMT_NOTIFY_TOKEN:-${TELEGRAM_INTAKE_TOKEN:-}}" ]; then
        echo "mgmt notify: skip (no token)"
        exit 0
      fi
      if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
        echo "mgmt notify: skip (no deploy attempt)"
        exit 0
      fi
      apk add --no-cache python3 >/dev/null 2>&1 || true
      chmod +x vdp/scripts/notify-mgmt.sh
      STATUS=failed
      [ "${CI_JOB_STATUS:-}" = "success" ] && STATUS=success
      REV="${CI_COMMIT_SHORT_SHA:-${CI_COMMIT_SHA:-}}"
      MGMT_NOTIFY_TOKEN="${MGMT_NOTIFY_TOKEN:-${TELEGRAM_INTAKE_TOKEN:-}}" \
      MGMT_NOTIFY_CHAT_ID="${MGMT_NOTIFY_CHAT_ID:-${TELEGRAM_INTAKE_CHAT_IDS:-}}" \
        ./vdp/scripts/notify-mgmt.sh \
          --kind promote \
          --env "${DEPLOY_ENVIRONMENT:-среда}" \
          --status "$STATUS" \
          --revision "$REV" || true

# Management TG on job failure (optional CI vars MGMT_NOTIFY_TOKEN + MGMT_NOTIFY_CHAT_ID)
.mgmt_notify_on_fail: &mgmt_notify_on_fail |
  if [ "${CI_JOB_STATUS:-}" = "success" ]; then
    exit 0
  fi
  if [ -z "${MGMT_NOTIFY_TOKEN:-${TELEGRAM_INTAKE_TOKEN:-}}" ]; then
    echo "mgmt notify: skip (no token)"
    exit 0
  fi
  apk add --no-cache bash curl python3 >/dev/null 2>&1 || true
  export MGMT_NOTIFY_TOKEN="${MGMT_NOTIFY_TOKEN:-${TELEGRAM_INTAKE_TOKEN:-}}"
  export MGMT_NOTIFY_CHAT_ID="${MGMT_NOTIFY_CHAT_ID:-${TELEGRAM_INTAKE_CHAT_IDS:-}}"
  export MGMT_CI_FAILED_STEPS="${CI_JOB_NAME}"
  chmod +x vdp/scripts/ci-mgmt-notify.sh vdp/scripts/notify-mgmt.sh
  ./vdp/scripts/ci-mgmt-notify.sh pipeline-fail || true

fast:
  stage: fast
  image: golang:${GO_VERSION}
  <<: *go_cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y -qq nodejs
  script:
    - cd vdp/fe && npm ci && npm test
    - cd "$CI_PROJECT_DIR/vdp" && make test
    - cd "$CI_PROJECT_DIR/vdp" && make test-adapters
  after_script:
    - *mgmt_notify_on_fail

docs:
  stage: docs
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apk add --no-cache bash docker-cli compose
    - cd vdp && make docs-format-check
    - cd vdp && make test-cd-scripts
  after_script:
    - *mgmt_notify_on_fail

integration:
  stage: integration
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
    - name: postgres:16
      alias: postgres
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs: [fast]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache bash curl postgresql-client go git make
    - |
      until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 1; done
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 <<'SQL'
      DO $$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vdp_core') THEN
          CREATE ROLE vdp_core LOGIN PASSWORD 'vdp_core';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vdp_hub') THEN
          CREATE ROLE vdp_hub LOGIN PASSWORD 'vdp_hub';
        END IF;
      END $$;
      SQL
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='vdp_core'" | grep -q 1 || \
        PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE vdp_core OWNER vdp_core;"
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='vdp_hub'" | grep -q 1 || \
        PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE vdp_hub OWNER vdp_hub;"
    - export DATABASE_URL_CORE="postgres://vdp_core:vdp_core@postgres:5432/vdp_core?sslmode=disable"
    - export DATABASE_URL_HUB="postgres://vdp_hub:vdp_hub@postgres:5432/vdp_hub?sslmode=disable"
  script:
    - cd vdp && make db-migrate
    - cd vdp && make test-integration
    - cd vdp && make compose-up
    - cd vdp && ./scripts/compose-e2e.sh
  after_script:
    - cd vdp && make compose-down || true
    - *mgmt_notify_on_fail

playwright:
  stage: playwright
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs: [integration]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apk add --no-cache bash make
    - cd vdp && make compose-up
    - cd vdp && CI=true PLAYWRIGHT_ARGS="e2e/login-form.spec.ts e2e/user-submit.spec.ts" make playwright-e2e
  after_script:
    - cd vdp && make compose-down || true
    - *mgmt_notify_on_fail

write-release-pin:
  stage: promote
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^vdp-v/'
    - if: '$DEPLOY_ACTION == "promote"'
    - when: never
  script:
    - apk add --no-cache bash
    - |
      TAG="${CI_COMMIT_TAG:-}"
      if [ -z "$TAG" ]; then
        TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
      REG="${CI_REGISTRY_IMAGE:-registry.gitlab.com/${CI_PROJECT_PATH}}"
      {
        echo "IMAGE_TAG=${TAG}"
        echo "GIT_REVISION=${CI_COMMIT_SHA}"
        echo "VDP_CORE_IMAGE=${REG}/vdp-core:${TAG}"
        echo "VDP_HUB_IMAGE=${REG}/vdp-hub:${TAG}"
        echo "VDP_DOCS_IMAGE=${REG}/vdp-docs:${TAG}"
        echo "VDP_MAIL_IMAGE=${REG}/vdp-mail:${TAG}"
        echo "VDP_SMS_IMAGE=${REG}/vdp-sms:${TAG}"
        echo "VDP_FE_IMAGE=${REG}/vdp-fe:${TAG}"
      } > vdp/.release-images.env
      cat vdp/.release-images.env
  artifacts:
    paths:
      - vdp/.release-images.env
    expire_in: 30 days

promote-alpha:
  <<: *promote_script
  stage: promote
  needs: [write-release-pin]
  environment:
    name: alpha
  rules:
    - if: '$DEPLOY_ACTION == "promote" && $DEPLOY_ENVIRONMENT == "alpha"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_MODE_ALPHA == "on_ready"'
    - when: never
  variables:
    DEPLOY_ENVIRONMENT: alpha

promote-beta:
  <<: *promote_script
  stage: promote
  needs: [write-release-pin]
  environment:
    name: beta
  variables:
    DEPLOY_ENVIRONMENT: beta
  rules:
    - if: '$DEPLOY_ACTION == "promote" && $DEPLOY_ENVIRONMENT == "beta"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

promote-gamma:
  <<: *promote_script
  stage: promote
  needs: [write-release-pin]
  environment:
    name: gamma
  variables:
    DEPLOY_ENVIRONMENT: gamma
  rules:
    - if: '$DEPLOY_ACTION == "promote" && $DEPLOY_ENVIRONMENT == "gamma"'
    - if: '$CI_COMMIT_TAG =~ /^vdp-v/'
      when: manual
    - when: never

promote-demo:
  <<: *promote_script
  stage: promote
  needs: [write-release-pin]
  environment:
    name: demo
  variables:
    DEPLOY_ENVIRONMENT: demo
  rules:
    - if: '$DEPLOY_ACTION == "promote" && $DEPLOY_ENVIRONMENT == "demo"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

promote-test:
  <<: *promote_script
  stage: promote
  needs: [write-release-pin]
  environment:
    name: test
  variables:
    DEPLOY_ENVIRONMENT: test
  rules:
    - if: '$DEPLOY_ACTION == "promote" && $DEPLOY_ENVIRONMENT == "test"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

# Push / MR → management TG (failures: job after_script via .mgmt_notify_on_fail)
mgmt-notify-event:
  stage: notify
  image: alpine:3.20
  when: always
  allow_failure: true
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - apk add --no-cache bash curl python3
    - |
      if [ -z "${MGMT_NOTIFY_TOKEN:-${TELEGRAM_INTAKE_TOKEN:-}}" ]; then
        echo "mgmt notify: skip (no token)"
        exit 0
      fi
      export MGMT_NOTIFY_TOKEN="${MGMT_NOTIFY_TOKEN:-${TELEGRAM_INTAKE_TOKEN:-}}"
      export MGMT_NOTIFY_CHAT_ID="${MGMT_NOTIFY_CHAT_ID:-${TELEGRAM_INTAKE_CHAT_IDS:-}}"
      chmod +x vdp/scripts/ci-mgmt-notify.sh vdp/scripts/notify-mgmt.sh
      case "${CI_PIPELINE_SOURCE}" in
        merge_request_event) ./vdp/scripts/ci-mgmt-notify.sh review ;;
        *) ./vdp/scripts/ci-mgmt-notify.sh push ;;
      esac

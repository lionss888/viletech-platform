# Default store for core/hub is Postgres (STORE_DRIVER=postgres).
# Memory driver is for unit tests only (STORE_DRIVER=memory).
#
# Published-port bind address is configurable per service so a public VM can keep
# everything on loopback behind a reverse proxy. Local dev keeps 0.0.0.0 defaults.
services:
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vdp_core
      POSTGRES_PASSWORD: vdp_core
      POSTGRES_DB: vdp_core
    ports:
      - "${DB_BIND:-0.0.0.0}:5433:5432"
    volumes:
      - ./core/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ./core/migrations/002_extended.sql:/docker-entrypoint-initdb.d/002_extended.sql:ro
      - ./core/migrations/003_seed.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
      - ./core/migrations/004_auth_org_r2.sql:/docker-entrypoint-initdb.d/004_auth_org_r2.sql:ro
      - ./core/migrations/005_r4_docs_domain.sql:/docker-entrypoint-initdb.d/005_r4_docs_domain.sql:ro
      - ./core/migrations/006_r6_rate_docs.sql:/docker-entrypoint-initdb.d/006_r6_rate_docs.sql:ro
      - ./core/migrations/007_r3_contracts.sql:/docker-entrypoint-initdb.d/007_r3_contracts.sql:ro
      - ./core/migrations/008_r4_docs_parity.sql:/docker-entrypoint-initdb.d/008_r4_docs_parity.sql:ro
      - ./core/migrations/009_r5_multi_order.sql:/docker-entrypoint-initdb.d/009_r5_multi_order.sql:ro
      - ./core/migrations/010_r9_extended.sql:/docker-entrypoint-initdb.d/010_r9_extended.sql:ro
      - ./core/migrations/011_r10_bank.sql:/docker-entrypoint-initdb.d/011_r10_bank.sql:ro
      - ./core/migrations/012_b2_org_signer.sql:/docker-entrypoint-initdb.d/012_b2_org_signer.sql:ro
      - ./core/migrations/013_bank_org_client_type.sql:/docker-entrypoint-initdb.d/013_bank_org_client_type.sql:ro
      - ./core/migrations/014_notifications.sql:/docker-entrypoint-initdb.d/014_notifications.sql:ro
      - ./core/migrations/015_role_process_config.sql:/docker-entrypoint-initdb.d/015_role_process_config.sql:ro
      - ./core/migrations/016_account_kind_caps.sql:/docker-entrypoint-initdb.d/016_account_kind_caps.sql:ro
      - ./core/migrations/017_role_mandatory_and_pilot_compliance.sql:/docker-entrypoint-initdb.d/017_role_mandatory_and_pilot_compliance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdp_core -d vdp_core"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-hub:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vdp_hub
      POSTGRES_PASSWORD: vdp_hub
      POSTGRES_DB: vdp_hub
    ports:
      - "${DB_BIND:-0.0.0.0}:5434:5432"
    volumes:
      - ./hub/migrations/001_hub.sql:/docker-entrypoint-initdb.d/001_hub.sql:ro
      - ./hub/migrations/002_hub.sql:/docker-entrypoint-initdb.d/002_hub.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdp_hub -d vdp_hub"]
      interval: 3s
      timeout: 3s
      retries: 20

  docs-service:
    build:
      context: ./docs-service
      dockerfile: Dockerfile
    environment:
      PORT: "8090"
      DOCS_PATH: /generate
    ports:
      - "${DOCS_BIND:-0.0.0.0}:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  extraction:
    build:
      context: .
      dockerfile: extraction/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8093"
      EXTRACTION_PRIMARY: ${EXTRACTION_PRIMARY:-fixture}
      EXTRACTION_FALLBACK: ${EXTRACTION_FALLBACK:-fixture}
      EXTRACTION_SHADOW_URL: ${EXTRACTION_SHADOW_URL:-}
      EXTRACTION_GOLD_DIR: /var/vdp/extraction-gold
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL_URI: ${YANDEX_MODEL_URI:-}
      OWN_MODEL_PATH: ${OWN_MODEL_PATH:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OWN_FEW_SHOT_K: ${OWN_FEW_SHOT_K:-3}
    volumes:
      - extraction_gold:/var/vdp/extraction-gold
    ports:
      - "${EXTRACTION_BIND:-0.0.0.0}:8093:8093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Optional: long-lived Ollama with persistent model volume (no pull on start).
  # Use: docker compose --profile own up -d ollama
  # Prefer host Ollama for day-to-day; do not add to default compose-up.
  ollama:
    profiles: ["own"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"

  mail-gateway:
    build:
      context: ./mail-gateway
      dockerfile: Dockerfile
    environment:
      PORT: "8091"
      MAIL_PROVIDER: local
    ports:
      - "${MAIL_BIND:-0.0.0.0}:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  sms-gateway:
    build:
      context: ./sms-gateway
      dockerfile: Dockerfile
    environment:
      PORT: "8092"
      SMS_PROVIDER: local
    ports:
      - "${SMS_BIND:-0.0.0.0}:8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Roster (managers/chats) + behavioral analytics; no shared DB with core.
  # Optional: COMPOSE_PROFILES=manager-ops docker compose up -d --build manager-ops
  # Keep off default compose-up so CI/playwright gates are not blocked by this side service.
  manager-ops:
    profiles: ["manager-ops"]
    build:
      context: .
      dockerfile: manager-ops/Dockerfile
    environment:
      PORT: "8094"
      CORE_URL: http://core:8080
      HUB_SHARED_SECRET: vdp-s2s-dev-secret
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MANAGER_OPS_CHAT_IDS: ${MANAGER_OPS_CHAT_IDS:-}
    ports:
      - "${MANAGER_OPS_BIND:-0.0.0.0}:8094:8094"
    depends_on:
      core:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8094/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    environment:
      PORT: "8081"
      STORE_DRIVER: postgres
      HUB_SHARED_SECRET: vdp-s2s-dev-secret
      CORE_URL: http://core:8080
      DOCS_URL: http://docs-service:8090/generate
      OCR_URL: http://extraction:8093/recognize
      MAIL_URL: http://mail-gateway:8091/notify
      SMS_URL: http://sms-gateway:8092/notify
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-vdp_notify_bot}
      DATABASE_URL: postgres://vdp_hub:vdp_hub@postgres-hub:5432/vdp_hub?sslmode=disable
    ports:
      - "${HUB_BIND:-0.0.0.0}:8081:8081"
    depends_on:
      postgres-hub:
        condition: service_healthy
      docs-service:
        condition: service_healthy
      extraction:
        condition: service_healthy
        required: false
      # Release overlay keeps the gateways behind the "gateways" profile, so the
      # dependency must stay optional: hub falls back to notify stubs without them.
      mail-gateway:
        condition: service_healthy
        required: false
      sms-gateway:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      PORT: "8080"
      STORE_DRIVER: postgres
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_WIPE_FORMS: ${SEED_WIPE_FORMS:-1}
      HUB_URL: http://hub:8081
      HUB_SHARED_SECRET: vdp-s2s-dev-secret
      JWT_SECRET: vdp-core-dev-secret
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-2000}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-vdp_notify_bot}
      EXTRACTION_URL: http://extraction:8093
      DOCS_HEALTH_URL: http://docs-service:8090/health
      MAIL_HEALTH_URL: http://mail-gateway:8091/health
      SMS_HEALTH_URL: http://sms-gateway:8092/health
      # Optional: set when COMPOSE_PROFILES=manager-ops
      # MANAGER_OPS_HEALTH_URL: http://manager-ops:8094/health
      DATABASE_URL: postgres://vdp_core:vdp_core@postgres-core:5432/vdp_core?sslmode=disable
      VDP_BLOB_DIR: /var/vdp/blobs
    volumes:
      - core_blobs:/var/vdp/blobs
    ports:
      - "${CORE_BIND:-0.0.0.0}:8080:8080"
    depends_on:
      postgres-core:
        condition: service_healthy
      hub:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: development
    environment:
      VDP_API_PROXY_TARGET: http://core:8080
    ports:
      - "5173:5173"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules

  fe-prod:
    profiles: ["prod"]
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: production
      args:
        VDP_API_PROXY_TARGET: http://core:8080
    environment:
      VDP_API_PROXY_TARGET: http://core:8080
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "${FE_PROD_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  fe_node_modules:
  core_blobs:
  extraction_gold:
  ollama_models:

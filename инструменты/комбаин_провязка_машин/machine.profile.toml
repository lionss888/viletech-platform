# Профиль локального QG для macOS-машины.
# Канон gate: .cursor/rules/vdp-ci-local-gate.mdc
# Этот файл — ориентир для apply-macos.sh / verify.sh (не секреты).

[identity]
name = "vdp-local-qg"
os = "macos"
shell = "zsh"

[repo]
# Относительно корня viletech-platform после clone
hooks_path = ".githooks"
install_via = "make -C vdp install-git-hooks"
# Эквивалент: git config core.hooksPath .githooks

[pre_commit]
# Что реально бежит при Commit в CLI / GitHub Desktop / Cursor
steps = [
  "vdp/scripts/check-env-parity.sh",
  "vdp/scripts/precommit-mgmt-notify.sh → docs-format-check + make test",
]
# На fail: notify в mgmt TG (если есть токен). На pass: без шума в чат.
notify_on = "fail_only"

[toolchain]
node = "22.17.0"          # = vdp/fe/.nvmrc
go_min = "1.22"           # go.mod модулей vdp/*
make = true
docker = "optional_for_commit"  # нужен для ci-pr / playwright, не для pre-commit unit

[paths_gui]
# GitHub Desktop и GUI не читают ~/.zshrc — PATH должен включать бинарники без nvm-only.
homebrew_intel = "/usr/local/bin"
homebrew_apple_silicon = "/opt/homebrew/bin"
go_default = "/usr/local/go/bin"

[mgmt_notify]
# Секреты НЕ в git. Шаблон: env.mgmt.notify.example → ~/.vedy_bot/env
env_file_primary = "~/.vedy_bot/env"
env_file_fallback = "~/.vdp-intake/env"
required_keys = ["MGMT_NOTIFY_TOKEN", "MGMT_NOTIFY_CHAT_ID"]
# Без токена: pre-commit gate всё равно обязателен; TG-notify на fail просто skip.

[ladder]
# После коммита, перед push/PR — не путать с pre-commit
env_parity = "make -C vdp check-env-parity"
precommit = "make -C vdp precommit-gate"
pr_smoke = "make -C vdp ci-pr"
pr_pilot = "make -C vdp ci-pr-pilot"
# ci-pr-pilot обязателен если трогали vdp/fe/e2e/** или @pilot-matrix / ActionPanel / formpayment

version: "2"

volumes:
  redis_data:
  mongo_data:
  minio_data:

services:
  redis:
    image: redis:latest
    container_name: redis_compose
    restart: unless-stopped
    ports:
      - "6380:6379"  # Внешний порт 6380, внутренний 6379
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:latest
    container_name: mongodb_compose
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fea360
    volumes:
      - mongo_data:/data/db
    command: mongod --noauth

  nats:
    image: nats:latest
    container_name: nats_compose
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"

  gotenberg:
    image: gotenberg/gotenberg:latest
    container_name: gotenberg_compose
    restart: unless-stopped
    ports:
      - "3333:3000"

  # Local S3-compatible object storage for PDF uploads (E7)
  minio:
    image: minio/minio:latest
    container_name: minio_compose
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: minio_init_compose
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/fea360 || true;
      exit 0;
      "

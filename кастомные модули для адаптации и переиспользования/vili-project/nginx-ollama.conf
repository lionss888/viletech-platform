# Конфигурация nginx для балансировки нагрузки между инстансами Ollama
# Стратегия: least_conn (отправлять на наименее загруженный сервер)

events {
    worker_connections 1024;
}

http {
    # Upstream блок с двумя Ollama инстансами
    upstream ollama_backend {
        # Стратегия балансировки: least_conn
        # Запросы направляются на сервер с наименьшим числом активных соединений
        least_conn;
        
        # Ollama Instance 1
        server ollama-1:11434 max_fails=3 fail_timeout=30s;
        
        # Ollama Instance 2
        server ollama-2:11434 max_fails=3 fail_timeout=30s;
        
        # Keep-alive соединения для повышения производительности
        keepalive 32;
    }

    # Логирование
    access_log /var/log/nginx/ollama_access.log;
    error_log /var/log/nginx/ollama_error.log;

    # Сервер на порту 11434 (публичный endpoint)
    server {
        listen 11434;
        
        # Увеличенные таймауты для длительной генерации текста
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        location / {
            # Проксирование на upstream ollama_backend
            proxy_pass http://ollama_backend;
            
            # HTTP/1.1 с keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Передача заголовков от клиента
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Отключение буферизации для streaming responses
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Увеличение размера буфера для больших промптов
            client_max_body_size 10M;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "nginx load balancer is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

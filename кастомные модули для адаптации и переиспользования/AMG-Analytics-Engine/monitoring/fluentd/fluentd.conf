# Fluentd конфигурация для AMG Banking Core
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Логи PostgreSQL
<source>
  @type tail
  path /var/log/postgresql/*.log
  pos_file /var/log/fluentd/postgresql.log.pos
  tag postgresql
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \w+) (?<level>\w+): (?<message>.*)$/
  </parse>
</source>

# Логи ClickHouse
<source>
  @type tail
  path /var/log/clickhouse-server/*.log
  pos_file /var/log/fluentd/clickhouse.log.pos
  tag clickhouse
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{4}\.\d{2}\.\d{2} \d{2}:\d{2}:\d{2}) (?<level>\w+) (?<message>.*)$/
  </parse>
</source>

# Логи AMG Dashboard
<source>
  @type tail
  path /app/logs/*.log
  pos_file /var/log/fluentd/dashboard.log.pos
  tag dashboard
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?<level>\w+) (?<message>.*)$/
  </parse>
</source>

# Логи Docker контейнеров
<source>
  @type tail
  path /var/lib/docker/containers/*/*-json.log
  pos_file /var/log/fluentd/docker.log.pos
  tag docker
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%L
  </parse>
</source>

# Фильтры для обработки логов
<filter **>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "#{ENV['ENVIRONMENT'] || 'development'}"
    service "amg-banking"
  </record>
</filter>

# Фильтр для ошибок
<filter **>
  @type grep
  <regexp>
    key level
    pattern /ERROR|FATAL|CRITICAL/
  </regexp>
</filter>

# Вывод в Elasticsearch
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix amg-banking
  <buffer>
    @type file
    path /var/log/fluentd/buffer
    flush_interval 10s
    retry_max_interval 30
    retry_forever false
  </buffer>
</match>

# Резервный вывод в файл
<match **>
  @type file
  path /var/log/fluentd/amg-banking
  append true
  <format>
    @type json
  </format>
  <buffer>
    @type file
    path /var/log/fluentd/buffer
    flush_interval 10s
  </buffer>
</match>

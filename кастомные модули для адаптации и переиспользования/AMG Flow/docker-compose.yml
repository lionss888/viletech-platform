version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Go Backend (Core)
  go-backend:
    build: ./go-backend
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://user:pass@db:5432/appdb?sslmode=require
      - PYTHON_ANALYTICS_URL=http://python-api:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Python Analytics API
  python-api:
    build: .
    environment:
      - APP_ENV=dev
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b-instruct-q4_0
      - PG_DSN=postgresql+psycopg2://user:pass@db:5432/appdb
      - DB_POOL_SIZE=10
      - DB_POOL_TIMEOUT=30
      - ENABLE_CORS=http://localhost:5173,http://localhost:3000,http://localhost:8080
      - LOG_LEVEL=INFO
      - REQUEST_ID_HEADER=X-Request-ID
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      chroma:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting Python Analytics API...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Ollama Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # ChromaDB Vector Store
  chroma:
    image: chromadb/chroma:0.5.13
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # React Client (Development)
  client-dev:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_DEFAULT_MODEL=llama3.2:3b-instruct-q4_0
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - go-backend
    networks:
      - app-network

  # React Client (Production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - go-backend
    profiles:
      - production
    networks:
      - app-network

volumes:
  postgres_data:
  ollama_data:
  chroma_data:

networks:
  app-network:
    driver: bridge
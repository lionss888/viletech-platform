repos:
  # Go security checks
  - repo: local
    hooks:
      - id: gosec
        name: gosec
        entry: gosec
        language: system
        args: [-fmt=json, -severity=medium, ./go-backend/...]
        files: \.go$
        
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint
        language: system
        args: [run, --config=.golangci-security.yml, ./go-backend/...]
        files: \.go$

  # Python security checks
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: bandit
        language: system
        args: [-r, app/, -f, json, -o, bandit-report.json]
        files: \.py$
        
      - id: safety
        name: safety
        entry: safety
        language: system
        args: [check, --json, --output, safety-report.json]
        files: pyproject\.toml$

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

version: '3.8'

services:
  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-blue
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Blue API (Production)
  api-blue:
    build: .
    environment:
      - APP_ENV=prod
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b-instruct-q4_0
      - PG_DSN=${PG_DSN}
      - ENABLE_CORS=${ENABLE_CORS:-http://localhost:3000}
      - LOG_LEVEL=INFO
      - REQUEST_ID_HEADER=X-Request-ID
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-blue.rule=Host(`api-blue.localhost`)"
      - "traefik.http.services.api-blue.loadbalancer.server.port=8000"

  # Green API (Staging/New Version)
  api-green:
    build: .
    environment:
      - APP_ENV=prod
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b-instruct-q4_0
      - PG_DSN=${PG_DSN}
      - ENABLE_CORS=${ENABLE_CORS:-http://localhost:3000}
      - LOG_LEVEL=INFO
      - REQUEST_ID_HEADER=X-Request-ID
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - green
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-green.rule=Host(`api-green.localhost`)"
      - "traefik.http.services.api-green.loadbalancer.server.port=8000"

  # Client (Production)
  client:
    build: ./client
    expose:
      - "80"
    depends_on:
      - nginx
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  ollama_data:

networks:
  app-network:
    driver: bridge
